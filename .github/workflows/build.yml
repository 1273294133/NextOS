# ============================================================================
#  NextOS — GitHub Actions 构建流水线（含缓存）
#
#  缓存设计（已实测验证有效性）：
#   1. 编译镜像缓存 → GHCR (ghcr.io/<owner>/nextos-builder:<Dockerfile哈希>)
#      构建环境镜像(archlinux+全部构建依赖)只构建/推送一次，后续运行直接
#      docker pull 复用，避免每轮重装依赖。按 Dockerfile 内容哈希做 tag，
#      改 Dockerfile 才会重新构建，保证缓存不失效于错误镜像。
#   2. ccache 编译缓存 → full 模式显式开启 LOCAL_CCACHE_SUPPORT=yes，
#      缓存目录位于 build.NextOS-*/ 下；在持久化磁盘的自托管 runner 上，
#      连续构建会自动复用（无需 actions/cache，构建根本身即缓存）。
#
#  两种模式（workflow_dispatch 选择）：
#   · smoke（默认，托管 runner 即可）：恢复镜像 + 容器内 checkdeps + 加载配置，
#      验证构建环境就绪。
#   · full（完整交叉编译整包发行版）：真正编译内核+工具链+Mesa/sway/ES/模拟器等，
#      产出可刷写镜像。**必须在自托管/larger runner 上跑**（磁盘≥80GB，数小时）。
#
#  触发：手动 workflow_dispatch；push/PR 到 main 且改动构建相关路径时自动跑 smoke。
# ============================================================================

name: Build NextOS

on:
  workflow_dispatch:
    inputs:
      device:
        description: '目标设备（决定内核/GPU 栈）'
        required: true
        default: 'Amlogic-nxtos'
        type: choice
        options:
          - Amlogic-nxtos   # S905W L/D/M，mainline 7.x + Lima（主推，开源全栈）
          - Amlogic-no      # S905X5/X5M/S928X，BSP 5.15 + libMali 闭源 blob
          - RK3326
      mode:
        description: 'smoke=环境检查(托管runner可跑)；full=完整编译(需自托管大runner)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full
      runner:
        description: 'runner 标签。smoke 用 ubuntu-latest；full 填自托管标签(如 nextos-builder)'
        required: false
        default: 'ubuntu-latest'

  push:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'projects/**'
      - 'config/**'
      - 'scripts/**'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write   # 推送/拉取 GHCR 编译镜像缓存

# 同一分支同时只跑一个构建，避免资源抢占
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: NextOS ${{ inputs.device || 'Amlogic-nxtos' }} [${{ inputs.mode || 'smoke' }}]
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 360
    env:
      DEVICE: ${{ inputs.device || 'Amlogic-nxtos' }}
      MODE: ${{ inputs.mode || 'smoke' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "== OS / 内核 =="; uname -a
          echo "== CPU =="; nproc
          echo "== 内存 =="; free -h | head -2
          echo "== 磁盘 =="; df -h / | tail -1
          echo "== Docker =="; docker version 2>/dev/null | head -3 || echo "no docker (full 模式需要)"
          echo "== Git =="; git --version
          echo "DEVICE=$DEVICE  MODE=$MODE"

      # ------------------------------------------------------------------
      # 编译镜像缓存：命中 GHCR 直接复用，否则构建并推送。
      # tag 用 Dockerfile 内容哈希，改 Dockerfile 自动失效重建，保证正确性。
      # ------------------------------------------------------------------
      - name: 恢复或构建编译镜像（GHCR 缓存）
        run: |
          set -e
          HASH=$(sha256sum Dockerfile | cut -c1-12)
          IMG="ghcr.io/${{ github.repository_owner }}/nextos-builder:${HASH}"
          echo "cache image: $IMG"
          if docker pull "$IMG" 2>/dev/null; then
            docker tag "$IMG" archr-build:latest
            echo "命中 GHCR 缓存，跳过镜像重建"
          else
            echo "无缓存，构建编译镜像..."
            make docker-image-build
            docker tag archr-build:latest "$IMG"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker push "$IMG"
            echo "镜像已推送至 GHCR"
          fi

      # ------------------------------------------------------------------
      # smoke：容器内验证构建环境就绪 + 项目配置可加载。
      # ------------------------------------------------------------------
      - name: Smoke 检查（容器内 checkdeps + 项目配置加载）
        if: ${{ env.MODE == 'smoke' }}
        run: |
          ./scripts/get_env > .env
          docker run --rm --env-file .env \
            --user "$(id -u):$(id -g)" \
            -v "$(pwd)":/work -w /work \
            archr-build:latest \
            bash -lc '
              echo "--- checkdeps ---";
              bash scripts/checkdeps || { echo "::error::checkdeps 未通过"; exit 1; };
              echo "--- 加载项目配置 ---";
              . config/options;
              echo "OK: PROJECT=$PROJECT  DEVICE=$DEVICE  DISTRO=$DISTRO  WM=$WINDOWMANAGER";
            '

      # ------------------------------------------------------------------
      # full：完整交叉编译整包发行版（含 arm + aarch64 两套）。
      # 显式开启 ccache(LOCAL_CCACHE_SUPPORT=yes)；在持久化自托管 runner 上，
      # build.NextOS-*/ 与 ccache 目录跨轮保留 → 连续构建自动增量复用。
      # 产物输出 target/ 与 release/，随后上传为 artifact。
      # ------------------------------------------------------------------
      - name: 完整编译发行版（full）
        if: ${{ env.MODE == 'full' }}
        env:
          LOCAL_CCACHE_SUPPORT: 'yes'
          OFFICIAL: 'no'
        run: make docker-${{ inputs.device || 'Amlogic-nxtos' }}

      - name: 上传构建产物（full）
        if: ${{ env.MODE == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: NextOS-${{ inputs.device || 'Amlogic-nxtos' }}
          path: |
            target/NextOS-${{ inputs.device || 'Amlogic-nxtos' }}-*
            release/NextOS-${{ inputs.device || 'Amlogic-nxtos' }}-*
          if-no-files-found: error
